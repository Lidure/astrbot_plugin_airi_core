<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="配置 Airi Core 每日 Poke 里程碑与查看自动禁言记录">
<title>Airi Poke 管理</title>
<style>
/* Hallmark · app screen · Coral · Airi Poke milestone workbench · 2026-11-27 */
/* Critique: a compact administrative workbench; a clear master switch, readable rules and an execution log; desktop AstrBot View, no marketing chrome. */
:root {
  color-scheme: light;
  --paper: oklch(97% .008 45); --surface: oklch(99% .004 70); --surface-2: oklch(94% .012 35);
  --ink: oklch(24% .018 25); --muted: oklch(46% .02 30); --rule: oklch(86% .018 35);
  --accent: oklch(54% .17 12); --accent-ink: oklch(99% .005 30);
  --good: oklch(46% .12 150); --bad: oklch(51% .18 25); --focus: oklch(55% .19 12);
  --overlay: oklch(15% .02 25 / .35); --shadow: 0 12px 32px oklch(30% .03 20 / .08);
  --font: Inter, "Microsoft YaHei", system-ui, sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s12:48px;
  --radius:12px; --control-radius:8px;
}
:root[data-theme=dark] {
  color-scheme:dark;
  --paper: oklch(22% .012 30); --surface: oklch(26% .014 30); --surface-2: oklch(30% .018 30);
  --ink: oklch(94% .008 60); --muted: oklch(72% .015 40); --rule: oklch(39% .018 30);
  --accent: oklch(76% .13 12); --accent-ink: oklch(20% .02 20);
  --good: oklch(75% .13 150); --bad: oklch(75% .16 25); --focus: oklch(78% .13 12);
  --overlay: oklch(10% .01 25 / .7); --shadow: 0 12px 32px oklch(0% 0 0 / .2);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; overflow-x:clip; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:14px; }
button,input,textarea { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
button:disabled,input:disabled,textarea:disabled { opacity:.55; cursor:not-allowed; }
.shell { max-width:1280px; margin:auto; padding:var(--s8) var(--s8) var(--s12); }
.top,.section-head,.status,.drawer-head { display:flex; align-items:center; justify-content:space-between; gap:var(--s4); }
.top { margin-bottom:var(--s6); }
.brand h1 { text-wrap:balance; font-size:26px; margin:0 0 var(--s1); letter-spacing:-.035em; overflow-wrap:break-word; min-width:0; }
.brand p { margin:0; color:var(--muted); }
.top-actions,.row-actions,.drawer-foot { display:flex; align-items:center; gap:var(--s2); }
.btn { border:1px solid var(--rule); border-radius:var(--control-radius); padding:var(--s2) var(--s4); min-height:40px; background:var(--surface); color:var(--ink); font-weight:600; white-space:nowrap; }
.btn.secondary { background:transparent; }
.btn:hover:not(:disabled) { background:var(--surface-2); }
.btn:active:not(:disabled) { transform:translateY(1px); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background:color-mix(in oklch,var(--accent) 90%,var(--ink)); }
.status { padding:var(--s4) var(--s5); border:1px solid var(--rule); border-radius:var(--radius); background:var(--surface); margin-bottom:var(--s6); }
.status-copy { flex:1; min-width:0; }
.status-copy strong { display:block; font-size:16px; margin-bottom:var(--s1); }
.status-copy span { color:var(--muted); line-height:1.5; }
.switch { appearance:none; width:44px; height:24px; border-radius:99px; background:var(--rule); position:relative; flex:none; cursor:pointer; transition:background-color .16s ease; }
.switch:after { content:""; position:absolute; top:4px; left:4px; width:16px; height:16px; border-radius:50%; background:var(--surface); transition:transform .16s ease; }
.switch:checked { background:var(--accent); }
.switch:checked:after { transform:translateX(20px); }
.section-head { margin:var(--s8) 0 var(--s3); }
.section-head h2 { text-wrap:balance; font-size:18px; margin:0; letter-spacing:-.02em; overflow-wrap:break-word; min-width:0; }
.section-head p { color:var(--muted); margin:var(--s1) 0 0; }
.panel { border:1px solid var(--rule); border-radius:var(--radius); background:var(--surface); color:var(--ink); overflow:clip; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:720px; }
th,td { text-align:left; padding:var(--s3) var(--s4); border-bottom:1px solid var(--rule); vertical-align:middle; }
th { font-weight:600; color:var(--muted); font-size:12px; background:var(--surface-2); white-space:nowrap; }
tr:last-child td { border-bottom:0; }
td { overflow-wrap:anywhere; }
.rule-name { font-weight:650; }
.sub { display:block; color:var(--muted); font-size:12px; margin-top:var(--s1); }
.pill { display:inline-flex; align-items:center; border:1px solid var(--rule); border-radius:99px; padding:var(--s1) var(--s2); color:var(--muted); font-size:12px; white-space:nowrap; }
.pill.on { color:var(--good); border-color:color-mix(in oklch,var(--good) 35%,var(--rule)); background:color-mix(in oklch,var(--good) 9%,var(--surface)); }
.row-actions { gap:var(--s1); white-space:nowrap; }
.text-btn { border:0; background:transparent; color:var(--muted); padding:var(--s2); border-radius:var(--control-radius); }
.text-btn:hover:not(:disabled) { background:var(--surface-2); color:var(--ink); }
.text-btn.danger:hover:not(:disabled) { color:var(--bad); }
.empty,.loading { padding:var(--s8); text-align:center; color:var(--muted); }
.history { min-width:780px; }
.history td { font-size:13px; }
.result { font-weight:600; }
.result.success { color:var(--good); }
.result.failed { color:var(--bad); }
.note { margin-top:var(--s4); color:var(--muted); font-size:12px; line-height:1.7; }
.notice { margin:var(--s3) 0; padding:var(--s3); border-radius:var(--control-radius); background:var(--surface-2); color:var(--muted); }
.notice.error { color:var(--bad); }
[hidden] { display:none!important; }
.drawer { position:fixed; inset:0 0 0 auto; width:min(480px,100%); max-height:100%; height:100%; margin:0; border:0; overflow:auto; color:var(--ink); background:var(--surface); padding:var(--s6); box-shadow:var(--shadow); }
.drawer::backdrop { background:var(--overlay); }
.drawer-head { margin-bottom:var(--s6); }
.drawer h2 { text-wrap:balance; font-size:20px; margin:0; }
.close { font-size:20px; line-height:1; padding:var(--s2) var(--s3); }
.field { display:block; margin:0 0 var(--s4); }
.field span { display:block; font-weight:600; margin-bottom:var(--s2); }
.field small { display:block; color:var(--muted); font-weight:400; margin-top:var(--s1); line-height:1.5; }
.field input,.field textarea { width:100%; border:1px solid var(--rule); border-radius:var(--control-radius); padding:var(--s3); min-height:40px; background:var(--paper); color:var(--ink); }
.field textarea { min-height:104px; resize:vertical; line-height:1.5; }
.two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s3); }
.check { display:flex; align-items:center; gap:var(--s2); margin:var(--s4) 0; }
.check input { width:16px; height:16px; accent-color:var(--accent); }
.drawer-foot { justify-content:flex-end; margin-top:var(--s6); padding-top:var(--s4); border-top:1px solid var(--rule); }
@media(prefers-reduced-motion:reduce) { *,*:before,*:after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><h1>戳一戳里程碑</h1><p>Airi Core 自动禁言规则</p></div>
    <div class="top-actions">
      <button class="btn secondary" id="refresh" type="button">刷新数据</button>
      <button class="btn primary" id="add" type="button" disabled>新增规则</button>
    </div>
  </header>
  <section class="status">
    <div class="status-copy"><strong>自动禁言总开关</strong><span id="global-hint">正在读取设置…</span></div>
    <input class="switch" id="global" type="checkbox" aria-label="启用自动禁言" role="switch" disabled>
  </section>
  <div id="message" class="notice" role="status" aria-live="polite" hidden></div>
  <section aria-labelledby="rules-title">
    <div class="section-head"><div><h2 id="rules-title">里程碑规则</h2><p>按群、成员及统计日分别计数，每条规则每天最多成功触发一次。</p></div></div>
    <div class="panel" id="rules-panel"><div class="loading">正在读取规则…</div></div>
  </section>
  <section aria-labelledby="history-title">
    <div class="section-head"><div><h2 id="history-title">最近执行记录</h2><p>仅记录实际尝试的禁言，最多显示 100 条。</p></div></div>
    <div class="panel" id="history-panel"><div class="loading">正在读取记录…</div></div>
  </section>
  <p class="note">依赖插件的 Poke 统计开关；统计日按服务器时间每天 04:00 切换。浮动阈值在规则不变时按群、成员与统计日稳定生成。Bot 没有足够的群管理权限或角色未知时静默忽略。一次命中多条规则时采用最长禁言时长，最多附带一句 LLM 回复；只在禁言成功后生成。</p>
  <noscript>请启用 JavaScript，并通过 AstrBot 插件 View 打开此页。</noscript>
</main>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title">新增规则</h2><button type="button" class="btn close" id="close" aria-label="关闭">×</button></div>
  <form id="editor">
    <input type="hidden" name="id">
    <label class="field"><span>规则名称</span><input name="name" maxlength="40" required placeholder="例如：第 30 次戳戳"></label>
    <div class="two">
      <label class="field"><span>目标次数</span><input name="target" type="number" min="1" max="1000000" step="1" value="30" required></label>
      <label class="field"><span>随机浮动</span><input name="tolerance" type="number" min="0" max="10000" step="1" value="2" required><small>±N 次，默认 ±2</small></label>
    </div>
    <label class="field"><span>禁言时长（分钟）</span><input name="mute_minutes" type="number" min="1" max="43200" step="1" value="1" required></label>
    <label class="check"><input name="enabled" type="checkbox" checked>启用这条规则</label>
    <label class="check"><input name="llm_enabled" type="checkbox">禁言成功后附带 LLM 场景回复</label>
    <label class="field"><span>回复提示（可选）</span><textarea name="prompt" maxlength="1000" placeholder="例如：结合当前群聊气氛，轻轻吐槽对方又来戳我。"></textarea><small>留空则根据当前会话人设自动回复，不会改变人设。</small></label>
    <div id="form-error" class="notice error" role="alert" hidden></div>
    <div class="drawer-foot"><button type="button" class="btn" id="cancel">取消</button><button type="submit" class="btn primary" id="save">保存规则</button></div>
  </form>
</dialog>
<script>
(() => {
  "use strict";
  const bridge = window.AstrBotPluginView;
  const $ = id => document.getElementById(id);
  const ROUTES = {
    state:"poke-milestones/state", settings:"poke-milestones/settings",
    "rules/save":"poke-milestones/rules/save", "rules/toggle":"poke-milestones/rules/toggle",
    "rules/delete":"poke-milestones/rules/delete"
  };
  let state = null, busy = false, ready = false;
  const drawer = $("drawer"), form = $("editor");
  const node = (tag, content, klass) => {
    const el = document.createElement(tag);
    if (klass) el.className = klass;
    if (content !== undefined) el.textContent = String(content ?? "");
    return el;
  };
  const show = (msg, error=false) => {
    const el = $("message");
    el.textContent = msg; el.hidden = !msg; el.classList.toggle("error", error);
  };
  const errorText = error => error instanceof Error ? error.message : String(error);
  function controls() {
    $("refresh").disabled = busy || !ready;
    $("add").disabled = $("global").disabled = busy || !state || !ready;
    for (const item of $("rules-panel").querySelectorAll("button")) item.disabled = busy || !state;
    for (const item of form.elements) item.disabled = busy;
    $("close").disabled = busy;
    if (state) $("global").checked = state.enabled;
  }
  function accept(response) {
    if (response?.status === "error") throw Error(response.message || "请求未成功");
    const value = response?.data ?? response;
    if (!value || typeof value.enabled !== "boolean" ||
        !Array.isArray(value.rules) || !Array.isArray(value.history) ||
        value.rules.some(r => !r || typeof r.id !== "string" || typeof r.name !== "string" ||
          !Number.isInteger(r.target) || !Number.isInteger(r.tolerance) ||
          !Number.isInteger(r.mute_minutes) || typeof r.enabled !== "boolean" ||
          typeof r.llm_enabled !== "boolean") ||
        value.history.some(h => !h || typeof h !== "object")) {
      throw Error("返回数据格式不正确，请刷新");
    }
    state = value;
    render();
  }
  function table(panel, headers, rows, empty, klass="") {
    if (!rows.length) { panel.replaceChildren(node("div", empty, "empty")); return; }
    const wrap = node("div", undefined, "table-wrap"), tableEl = node("table", undefined, klass);
    const thead = node("thead"), heading = node("tr"), tbody = node("tbody");
    for (const text of headers) {
      const th = node("th", text); th.scope = "col"; heading.append(th);
    }
    thead.append(heading);
    for (const cells of rows) {
      const tr = node("tr");
      for (const content of cells) {
        const td = node("td");
        if (content instanceof Node) td.append(content); else td.textContent = String(content ?? "");
        tr.append(td);
      }
      tbody.append(tr);
    }
    tableEl.append(thead, tbody); wrap.append(tableEl); panel.replaceChildren(wrap);
  }
  function action(label, kind, rule, danger=false) {
    const btn = node("button", label, "text-btn" + (danger ? " danger" : ""));
    btn.type = "button"; btn.dataset[kind] = rule.id;
    btn.setAttribute("aria-label", label + "：" + rule.name);
    return btn;
  }
  function render() {
    $("global").checked = state.enabled;
    $("global-hint").textContent = state.enabled ? "已启用，仅在 Bot 有足够群管理权限时执行。" :
      "已关闭，不执行自动禁言。";
    table($("rules-panel"), ["规则名称","触发阈值","禁言时长","LLM 回复","状态","操作"],
      state.rules.map(r => {
        const name = node("span", r.name, "rule-name"); name.title = r.id;
        const threshold = node("div", r.target + " 次");
        threshold.append(node("span", "随机 ±" + r.tolerance + " 次", "sub"));
        const status = node("span", r.enabled ? "启用" : "停用", "pill" + (r.enabled ? " on" : ""));
        const actions = node("div", undefined, "row-actions");
        actions.append(action("编辑", "edit", r), action(r.enabled ? "停用" : "启用", "toggle", r),
          action("删除", "delete", r, true));
        return [name, threshold, r.mute_minutes + " 分钟", r.llm_enabled ? "开启" : "关闭", status, actions];
      }), "暂无里程碑规则。新增规则，再打开自动禁言总开关。");
    const labels = {success:"禁言成功", failed:"执行失败", unknown:"结果未知", pending:"执行中"};
    table($("history-panel"), ["时间（服务器）","群 / 用户","规则","触发次数","结果","说明"],
      state.history.slice(0,100).map(h => {
        const date = String(h.created_at ?? "");
        const time = node("span", date ? date.slice(0,19).replace("T"," ") : "—"); time.title = date;
        const identity = node("div", h.group_id ?? "—");
        identity.append(node("span", h.user_id ?? "—", "sub"));
        const result = node("span", labels[h.status] ?? "未知",
          "result" + (["success","failed"].includes(h.status) ? " " + h.status : ""));
        return [time, identity, h.rule_name || h.rule_id || "—", h.count == null ? "—" : h.count + " 次",
          result, h.detail || "—"];
      }), "暂无执行记录。", "history");
    controls();
  }
  async function refresh() {
    if (busy || !ready) return;
    busy = true; controls();
    try { accept(await bridge.apiGet(ROUTES.state)); show(""); }
    catch (error) {
      show("读取失败：" + errorText(error), true);
      if (!state) {
        $("global-hint").textContent = "设置不可用，请重试刷新。";
        for (const id of ["rules-panel", "history-panel"]) $(id).replaceChildren(node("div", "数据读取失败，请刷新重试。", "empty"));
      }
    } finally { busy = false; controls(); }
  }
  function open(rule) {
    if (busy || !state || drawer.open) return;
    form.reset();
    for (const [key,value] of Object.entries({
      id:rule?.id ?? "", name:rule?.name ?? "", target:rule?.target ?? 30,
      tolerance:rule?.tolerance ?? 2, mute_minutes:rule?.mute_minutes ?? 1, prompt:rule?.prompt ?? ""
    })) form.elements[key].value = value;
    form.elements.enabled.checked = rule?.enabled !== false;
    form.elements.llm_enabled.checked = rule?.llm_enabled === true;
    $("drawer-title").textContent = rule ? "编辑规则" : "新增规则";
    $("form-error").hidden = true;
    drawer.showModal(); form.elements.name.focus();
  }
  function close() { if (!busy && drawer.open) drawer.close(); }
  async function write(path, body, success, inForm=false) {
    if (busy || !state || !ready) return;
    busy = true; controls();
    try {
      accept(await bridge.apiPost(ROUTES[path], body));
      if (inForm) drawer.close();
      show(success);
    } catch (error) {
      if (inForm) { $("form-error").textContent = "保存失败：" + errorText(error); $("form-error").hidden = false; }
      else show("操作失败：" + errorText(error), true);
    } finally { busy = false; controls(); }
  }
  $("add").addEventListener("click", () => open(null));
  $("close").addEventListener("click", close);
  $("cancel").addEventListener("click", close);
  $("refresh").addEventListener("click", refresh);
  drawer.addEventListener("cancel", event => { if (busy) event.preventDefault(); });
  $("global").addEventListener("change", event => {
    const enabled = event.target.checked;
    return write("settings", {enabled}, enabled ? "自动禁言已开启。" : "自动禁言已关闭。");
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const f = form.elements, body = {
      name:f.name.value.trim(), target:Number(f.target.value), tolerance:Number(f.tolerance.value),
      mute_minutes:Number(f.mute_minutes.value), enabled:f.enabled.checked,
      llm_enabled:f.llm_enabled.checked, prompt:f.prompt.value.trim()
    };
    if (f.id.value) body.id = f.id.value;
    $("form-error").hidden = true;
    return write("rules/save", body, "规则已保存。", true);
  });
  $("rules-panel").addEventListener("click", event => {
    if (busy || !state) return;
    const btn = event.target.closest("button");
    if (!btn) return;
    const {edit, toggle, delete:remove} = btn.dataset;
    const rule = state.rules.find(r => r.id === (edit ?? toggle ?? remove));
    if (!rule) return;
    if (edit) open(rule);
    else if (toggle) return write("rules/toggle", {id:rule.id,enabled:!rule.enabled}, "规则状态已更新。");
    else if (remove && confirm("确定删除规则“" + rule.name + "”吗？")) {
      return write("rules/delete", {id:rule.id}, "规则已删除。");
    }
  });
  controls();
  if (bridge) {
    if (typeof bridge.onContext === "function") bridge.onContext(context => {
      document.documentElement.dataset.theme = context?.isDark ? "dark" : "light";
    });
    bridge.ready().then(() => { ready = true; controls(); return refresh(); }).catch(error => {
      show("AstrBot 页面桥接失败：" + errorText(error), true);
      $("global-hint").textContent = "页面连接失败，请重新打开插件 View。";
    });
  } else {
    $("global-hint").textContent = "请通过 AstrBot 插件 View 打开。";
    show("AstrBot 页面桥接未加载。", true);
    for (const id of ["rules-panel", "history-panel"]) $(id).replaceChildren(node("div", "等待 AstrBot 页面连接。", "empty"));
  }
})();
</script>
</body>
</html>
