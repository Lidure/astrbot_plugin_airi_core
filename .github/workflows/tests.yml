name: AiriCore Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pillow pydantic
      - name: Verify syntax
        run: python -m compileall -q main.py at_command_guard.py official_bot_filter.py keyword_wakeup.py mention_media.py qzone_auto_like.py config_sections.py console_api.py poke_milestones.py poke_milestones_web.py request_approval.py tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test the native sandboxed desktop View
        run: python tests/poke_milestones_webui_smoke.py
